[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi[standard]>=0.128.0",
    "joblib>=1.5.3",
    "librosa>=0.11.0",
    "numpy>=1.21.0,<2.0.0",
    "pydantic[email]>=2.12.5",
    "python-dotenv>=1.2.1",
    "python-jose>=3.3.0",
    "python-multipart>=0.0.21",
    "scikit-learn==1.6.1",
    "soundfile>=0.13.1",
    "supabase>=2.27.0",
    "tensorflow>=2.13.0",
    "tensorflow-hub>=0.15.0",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-env>=1.1",
    "httpx>=0.27",
    "anyio>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --tb=short"
markers = [
    "integration: hits real Supabase (auth, db, storage)",
    "ml: loads YAMNet/RandomForest model — slower",
    "slow: takes >2s",
]
env_files = [".env.test"]
filterwarnings = [
    # Third-party deprecation noise we don't control.
    "ignore::DeprecationWarning:tensorflow.*",
    "ignore::DeprecationWarning:librosa.*",
    "ignore::FutureWarning:librosa.*",
    "ignore::DeprecationWarning:audioread.*",
    "ignore::DeprecationWarning:supabase.*",
    "ignore::DeprecationWarning:pyiceberg.*",
    "ignore::FutureWarning:keras.*",
    "ignore::UserWarning:tensorflow_hub.*",
    "ignore::UserWarning:librosa.*",
    # Pydantic v2.12 deprecation surfaced via pyiceberg's @model_validator usage.
    "ignore:.*model_validator.*:DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/ml/yamnet_model.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
